<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="14" y1="10" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#0B101D"/>
    </linearGradient>
    <linearGradient id="prism-ring" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="38%" stop-color="#4285F4"/>
      <stop offset="72%" stop-color="#9B72CB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="sheen-grad" x1="20" y1="16" x2="92" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="65%" stop-color="#93C5FD" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cell-tl" x1="34" y1="34" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="cell-tr" x1="68" y1="34" x2="94" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="cell-bl" x1="34" y1="68" x2="60" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cell-br" x1="68" y1="68" x2="94" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#9B72CB"/>
    </linearGradient>
    <filter id="prism-halo" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <clipPath id="inner-plate-clip">
      <rect x="20" y="20" width="88" height="88" rx="20"/>
    </clipPath>
  </defs>

  <!-- Restrained Gemini Prism outer halo -->
  <rect x="10" y="10" width="108" height="108" rx="28" stroke="url(#prism-ring)" stroke-width="3.2" opacity="0.42" filter="url(#prism-halo)"/>

  <!-- Obsidian-navy squircle body + crisp 2.4px prism rim -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#bg-grad)" stroke="url(#prism-ring)" stroke-width="2.4"/>

  <!-- Subtle top-edge specular highlight -->
  <path d="M36 11.4H92" stroke="#E0F2FE" stroke-opacity="0.38" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Translucent inner optical glass plate -->
  <rect x="20" y="20" width="88" height="88" rx="20" fill="#FFFFFF" fill-opacity="0.045" stroke="#BFDBFE" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Subtle upper-left diagonal glass sheen -->
  <g clip-path="url(#inner-plate-clip)" opacity="0.12">
    <path d="M16 58L58 16H94L16 94V58Z" fill="url(#sheen-grad)"/>
  </g>

  <!-- 2x2 Blue Insights matrix -->
  <rect x="34" y="34" width="26" height="26" rx="7" fill="url(#cell-tl)" opacity="0.90"/>
  <rect x="68" y="34" width="26" height="26" rx="7" fill="url(#cell-tr)"/>
  <rect x="34" y="68" width="26" height="26" rx="7" fill="url(#cell-bl)"/>
  <rect x="68" y="68" width="26" height="26" rx="7" fill="url(#cell-br)"/>

  <!-- Tiny 4-point refraction spark in bottom-right cell -->
  <path d="M81 74.2L82.7 79.3L87.8 81L82.7 82.7L81 87.8L79.3 82.7L74.2 81L79.3 79.3L81 74.2Z" fill="#FFFFFF" fill-opacity="0.92"/>
</svg>
